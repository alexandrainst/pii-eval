[project]
name = "pii-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*" # ,<3.14" # vLLM supports 3.12-3.13; GLiNER is currently more reliable on 3.12
dependencies = [
    "bidict>=0.23.1",
    "spacy>=3.8.11",
    "codetiming>=1.4.0",
    "pytest>=9.0.2",
    "datasets>=4.8.4",
    "rich>=14.3.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "typer>=0.24.1",
    "da-core-news-sm",
    "openai>=2.44.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
]

[project.scripts]
pii-eval = "pii_eval.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_eval"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
da-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/da_core_news_sm-3.8.0/da_core_news_sm-3.8.0-py3-none-any.whl" }
