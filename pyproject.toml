[project]
name = "dfm-anonymization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14" # vLLM doesn't like >=3.14
dependencies = [
    "bidict>=0.23.1",
    "nltk>=3.9.3",
    "vllm>=0.16.0",
    "presidio>=0.1.0",
    "presidio-anonymizer>=2.2.360",
    "presidio-evaluator>=0.2.5",
    "gliner>=0.2.25",
    "spacy>=3.8.11",
    "codetiming>=1.4.0",
    "pytest>=9.0.2",
]

[project.scripts]
dfm-anonymization = "dfm_anonymization.__main__:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfm_anonymization"]
