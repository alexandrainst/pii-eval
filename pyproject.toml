[project]
name = "dfm-anonymization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bidict>=0.23.1",
    "click>=8.3.0",
    "codetiming>=1.4.0",
    "cupy-cuda12x>=13.6.0",
    "datasets>=4.1.1",
    "fastapi>=0.117.1",
    "faker>=37.11.0",
    "gliner>=0.2.22",
    "ipython>=9.8.0",
    "kaggle>=1.7.4.5",
    "kagglehub>=0.3.13",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "presidio>=0.1.0",
    "presidio-anonymizer>=2.2.360",
    "presidio-evaluator>=0.2.5",
    "pyconll>=3.3.1",
    "pytest>=9.0.2",
    "scrambletron",
    "spacy>=3.8.7",
    "tqdm>=4.67.1",
    "transformers>=4.51.0",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfm_anonymization"]

[project.scripts]
dfm-anonymization = "dfm_anonymization.__main__:main"

[tool.uv.sources]
scrambletron = { git = "https://github.com/danish-foundation-models/scrambletron", branch = "jacob-dv" }
dfm-anonymization = { workspace = true }

[dependency-groups]
dev = [
    "dfm-anonymization",
]
